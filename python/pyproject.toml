[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thewolf-local-service"
version = "0.1.0"
description = "Local service for the Personal Market Intelligence workspace"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "jsonschema==4.26.0",
  "requests>=2.31,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pmi.http_contract" = ["schemas.json", "generation.json", "openapi.resource", "operations.json"]
